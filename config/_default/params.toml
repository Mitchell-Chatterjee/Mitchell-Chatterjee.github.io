colorScheme = "ocean"
defaultAppearance = "dark"
autoSwitchAppearance = false

enableSearch = true
enableCodeCopy = true

mainSections = ["projects"]
defaultSocialImage = "img/avatar.jpg"
defaultBackgroundImage = "img/mountains.jpg"
backgroundCanvas = true # mountain photo behind every page

[header]
  layout = "fixed-fill-blur"

[footer]
  showMenu = false
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = false
  showScrollToTop = true

[homepage]
  layout = "background"
  homepageImage = "img/mountains.jpg"
  layoutBackgroundBlur = true
  showRecent = true
  showRecentItems = 3
  showMoreLink = true
  showMoreLinkDest = "/projects/"
  cardView = true
  cardViewScreenWidth = false

[article]
  showDate = false
  showAuthor = false
  showHero = true
  heroStyle = "big"
  showBreadcrumbs = false
  showHeadingAnchors = true
  showPagination = false
  showReadingTime = false
  showWordCount = false
  showTableOfContents = false
  showTaxonomies = true
  showRelatedContent = false

[list]
  showHero = false
  showSummary = true
  showCards = true
  cardView = true
  groupByYear = false
  orderByWeight = true

[taxonomy]
  showTermCount = true

[term]
  showTableOfContents = false
  groupByYear = false
  cardView = true
